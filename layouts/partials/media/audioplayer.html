{{- $autoplay := .autoplay -}}
{{- $src := .src -}}

{{- $id := printf "_audioplayer-%s" (md5 (printf "%s-%s" $src now.UnixNano)) -}}
<div class="audioplayer" id="{{ $id }}">
    <div class="button-container">
        <button class="audioplayer-button play" aria-label="{{ i18n "audioPlay" }}" data-play-label="{{ i18n "audioPlay" }}" data-pause-label="{{ i18n "audioPause" }}" aria-pressed="false"></button>
    </div>
    <script type="text/javascript">
        var player = document.getElementById('{{ $id }}');
        window.addEventListener('DOMContentLoaded', (event) => {
          audioplayer(player, '{{ $src }}', player.querySelector('button.audioplayer-button'));
        });
    </script>
</div>
